[project]
name = "rag-support"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "CHimPat073", email = "himanshupathak073@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.0",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.3",
    "langchain-groq>=1.1.3",
    "pymupdf>=1.28.2",
    "pypdf>=6.15.0",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.19.0",
    "sentence-transformers>=5.7.0",
]

[project.scripts]
rag-support = "backend.app.cli:main"
rag-verify = "backend.app.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
